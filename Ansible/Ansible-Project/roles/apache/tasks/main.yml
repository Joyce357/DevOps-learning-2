---
- name: Gather installed package information
  ansible.builtin.package_facts:
    manager: auto

- name: Stop and disable Nginx to release port 80
  ansible.builtin.service:
    name: nginx
    state: stopped
    enabled: false
  when: "'nginx' in ansible_facts.packages"

- name: Install Apache package
  ansible.builtin.apt:
    name: apache2
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Deploy the Class10 website
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: root
    group: root
    mode: "0644"
  notify: Restart apache service

- name: Apply Apache configuration changes before continuing
  ansible.builtin.meta: flush_handlers

- name: Enable and start Apache
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true
